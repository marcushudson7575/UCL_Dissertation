<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520">
<rect width="100%" height="100%" fill="white"/>
<text x="400.0" y="40" text-anchor="middle" font-size="28" font-family="Helvetica, Arial, sans-serif" fill="#222">Median session duration: weekday vs. weekend</text>
<line x1="90" y1="430" x2="730" y2="430" stroke="#333" stroke-width="2"/>
<line x1="90" y1="80" x2="90" y2="430" stroke="#333" stroke-width="2"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#444">
  <text x="65" y="435" text-anchor="end">0</text>
  <text x="65" y="365" text-anchor="end">1</text>
  <text x="65" y="295" text-anchor="end">2</text>
  <text x="65" y="225" text-anchor="end">3</text>
  <text x="65" y="155" text-anchor="end">4</text>
  <text x="65" y="85" text-anchor="end">5</text>
</g>
<g stroke="#ddd" stroke-width="1">
  <line x1="90" y1="360" x2="730" y2="360"/>
  <line x1="90" y1="290" x2="730" y2="290"/>
  <line x1="90" y1="220" x2="730" y2="220"/>
  <line x1="90" y1="150" x2="730" y2="150"/>
  <line x1="90" y1="80" x2="730" y2="80"/>
</g>
<rect x="160" y="87" width="220" height="343" fill="#1f77b4"/>
<rect x="440" y="318" width="220" height="112" fill="#ff7f0e"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#333">
  <text x="270" y="465" text-anchor="middle">Weekday</text>
  <text x="550" y="465" text-anchor="middle">Weekend</text>
</g>
<g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333">
  <text x="270" y="72" text-anchor="middle">4.9</text>
  <text x="550" y="303" text-anchor="middle">1.6</text>
</g>
<text x="28" y="255" transform="rotate(-90 28 255)" text-anchor="middle" font-size="22" font-family="Helvetica, Arial, sans-serif" fill="#444">Median duration (minutes)</text>
</svg>